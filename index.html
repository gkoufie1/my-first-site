<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Claude AWS Static</title>
  <style>
    :root {
      color-scheme: light dark;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #faf7f2;
      color: #2b2723;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      padding: 2rem;
      box-sizing: border-box;
    }
    main {
      max-width: 40rem;
      text-align: center;
    }
    h1 {
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      margin-bottom: 0.5rem;
      letter-spacing: -0.01em;
    }
    p {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #5c554c;
    }
    .badge {
      display: inline-block;
      margin-top: 1.5rem;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #9a8f7f;
    }
  </style>
</head>
<body>
  <main>
    <h1>Claude AWS Static</h1>
    <p>
      This site lives in an S3 bucket, is served worldwide by CloudFront,
      and redeploys itself every time I push to GitHub.
    </p>
    <span class="badge">Built with Claude Code</span>
  </main>
</body>
</html>
